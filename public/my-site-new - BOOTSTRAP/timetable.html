<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Thời khóa biểu - Portfolio</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>

    <style>
        * { font-family: "Inter", sans-serif; }
        :root {
            --bs-primary: #667eea;
            --bs-secondary: #764ba2;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        body.bg-light {
            background-color: #f4f5fb !important;
        }
        #calendar {
            background: #fff;
            border-radius: 1.25rem;
            padding: 1.25rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.05);
        }
        .fc .fc-toolbar-title {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .fc .fc-button-primary {
            background: #667eea;
            border: none;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background: #4b5fd1;
        }
        .timetable-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 1.5rem;
        }
        .form-label small {
            color: #999;
            font-weight: 400;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navbar (giữ giống theme) -->
<nav class="navbar navbar-expand-md fixed-top glass-effect border-bottom border-white border-opacity-25 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-4" href="{{ url('/') }}">Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                <li class="nav-item"><a href="{{ url('/') }}" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="{{ url('blogs') }}" class="nav-link">Blog</a></li>
                <li class="nav-item"><a href="{{ url('favorites') }}" class="nav-link">Favorites</a></li>
                <li class="nav-item"><a href="{{ route('public.theme.timetable') }}" class="nav-link active">Thời khóa biểu</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="pt-5 mt-5">
    <div class="container">
        <div class="timetable-header p-4 p-md-5 mb-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
            <div>
                <h1 class="h3 fw-bold mb-2">Thời khóa biểu</h1>
                <p class="mb-0">Xem lịch học theo ngày / tuần / tháng và thêm môn học nhanh.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-light text-primary fw-semibold" id="btnAddEvent" data-bs-toggle="modal" data-bs-target="#addEventModal">
                    <i class="fa fa-plus me-2"></i>Thêm lịch
                </button>
            </div>
        </div>

        <div id="calendar"></div>
    </div>
</section>

<!-- Modal thêm lịch -->
<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addEventModalLabel">Thêm môn học / lịch mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <form id="eventForm" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên môn học</label>
                        <input type="text" class="form-control" name="title" placeholder="VD: Cấu tạo kiến trúc 2" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Phòng</label>
                        <input type="text" class="form-control" name="room" placeholder="VD: M-M13.02">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Giáo viên</label>
                        <input type="text" class="form-control" name="teacher" placeholder="VD: Lê Hồng Mạnh">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ngày bắt đầu</label>
                        <input type="date" class="form-control" name="start_date" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ngày kết thúc <small>(nếu lặp)</small></label>
                        <input type="date" class="form-control" name="end_date">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Thứ</label>
                        <select name="weekday" class="form-select">
                            <option value="1">Thứ 2</option>
                            <option value="2">Thứ 3</option>
                            <option value="3">Thứ 4</option>
                            <option value="4">Thứ 5</option>
                            <option value="5">Thứ 6</option>
                            <option value="6">Thứ 7</option>
                            <option value="0">Chủ nhật</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Giờ bắt đầu</label>
                        <input type="time" class="form-control" name="start_time" value="07:00" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Giờ kết thúc</label>
                        <input type="time" class="form-control" name="end_time" value="09:40" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Màu</label>
                        <input type="color" class="form-control form-control-color" name="color" value="#667eea">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" id="isRecurring" name="is_recurring" checked>
                            <label class="form-check-label" for="isRecurring">
                                Lặp hàng tuần
                            </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Ghi chú</label>
                        <textarea name="note" rows="2" class="form-control" placeholder="Nội dung ghi chú..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" id="saveEventBtn">
                    <i class="fa fa-save me-2"></i>Lưu lịch
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- FullCalendar (global build) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
            },
            locale: 'vi',
            selectable: true,
            editable: false,
            height: 'auto',
            events: [
                // ví dụ data ban đầu
                {
                    title: 'GDTC P3',
                    start: '2025-08-25T13:00:00',
                    end: '2025-08-25T15:40:00',
                    backgroundColor: '#667eea',
                    borderColor: '#667eea'
                }
            ],
            eventClick: function(info) {
                // sau này bạn có thể mở modal sửa
                alert(info.event.title + '\\n' + (info.event.extendedProps.room || ''));
            }
        });

        calendar.render();

        $('#saveEventBtn').on('click', function () {
            const form = $('#eventForm');
            const title = form.find('[name="title"]').val();
            const room = form.find('[name="room"]').val();
            const teacher = form.find('[name="teacher"]').val();
            const startDate = form.find('[name="start_date"]').val();
            const endDate = form.find('[name="end_date"]').val();
            const weekday = parseInt(form.find('[name="weekday"]').val(), 10); // 0-6
            const startTime = form.find('[name="start_time"]').val();
            const endTime = form.find('[name="end_time"]').val();
            const color = form.find('[name="color"]').val();
            const note = form.find('[name="note"]').val();
            const isRecurring = form.find('[name="is_recurring"]').is(':checked');

            if (!title || !startDate || !startTime || !endTime) {
                alert('Vui lòng nhập đầy đủ thông tin bắt buộc!');
                return;
            }

            // build start datetime
            const startDateTime = startDate + 'T' + startTime;
            const endDateTime = startDate + 'T' + endTime;

            // nếu không lặp -> add 1 event
            if (!isRecurring || !endDate) {
                calendar.addEvent({
                    title: title + (room ? ' - ' + room : ''),
                    start: startDateTime,
                    end: endDateTime,
                    backgroundColor: color,
                    borderColor: color,
                    extendedProps: {
                        room: room,
                        teacher: teacher,
                        note: note
                    }
                });
            } else {
                // lặp hàng tuần từ startDate -> endDate theo weekday
                const start = new Date(startDate);
                const end = new Date(endDate);
                // chạy từ start tới end, nhảy từng ngày, nếu đúng thứ thì add
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    if (d.getDay() === weekday) {
                        const y = d.getFullYear();
                        const m = String(d.getMonth() + 1).padStart(2, '0');
                        const da = String(d.getDate()).padStart(2, '0');
                        const dayStr = y + '-' + m + '-' + da;
                        calendar.addEvent({
                            title: title + (room ? ' - ' + room : ''),
                            start: dayStr + 'T' + startTime,
                            end: dayStr + 'T' + endTime,
                            backgroundColor: color,
                            borderColor: color,
                            extendedProps: {
                                room: room,
                                teacher: teacher,
                                note: note
                            }
                        });
                    }
                }
            }

            // đóng modal + reset form nhẹ
            const modal = bootstrap.Modal.getInstance(document.getElementById('addEventModal'));
            modal.hide();
            form[0].reset();
            form.find('[name="is_recurring"]').prop('checked', true);
            form.find('[name="color"]').val('#667eea');
        });
    });
</script>

</body>
</html>
