services:
  app:
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
  mysql:
    ports:
      - "3306:3306"

  nginx:
    volumes:
      - .:/var/www/html

